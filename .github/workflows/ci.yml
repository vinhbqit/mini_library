name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      - name: Kiểm tra mã nguồn với ruff
        run: ruff check .

      - name: Chạy kiểm thử với pytest
        run: pytest -q
