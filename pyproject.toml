[project]
name = "mini-library"
version = "0.1.0"
description = "Hệ thống Thư viện mini (TVM-SRS-001 v1.0)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
